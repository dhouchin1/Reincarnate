[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reincarnate"
version = "0.1.0"
description = "Comprehend open-source repos into dossiers and recompose their capabilities clean-room."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
reincarnate = "reincarnate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reincarnate"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
