<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reincarnate: design your app</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
:root{--ink:#18181B;--ink2:#3F3F46;--muted:#52525B;--accent:#1D4ED8;--accent-d:#1E3A8A;--green:#15803D;--line:#DEDED9;--bg:#F6F6F3;--card:#fff}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.45}
button,input,textarea,select{font:inherit;color:inherit}
code,pre,.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
a{color:var(--accent)}a:hover{color:var(--accent-d)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1{margin:0;font-size:24px}
h2{margin:0;font-size:16px}
h3{margin:0;font-size:14px}
.wrap{max-width:1376px;margin:0 auto;padding:22px 32px 44px;display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.stack{display:flex;flex-direction:column;gap:8px;min-width:0}
.title{font-size:22px;font-weight:700}
.muted{color:var(--muted);font-size:12px}
.sm{font-size:12px;color:var(--ink2);overflow-wrap:anywhere}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:12px;border:1px solid var(--line);background:#fff;color:var(--ink2);max-width:100%;overflow-wrap:anywhere}
nav.studio{display:flex;flex-wrap:wrap;gap:8px}
.nav{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 16px;border-radius:10px;font-weight:500;border:1px solid #C9C9C3;background:#fff;color:#27272A;text-decoration:none}
.nav .num{display:inline-flex;width:22px;height:22px;border-radius:11px;background:#E7E7E2;font-size:12px;align-items:center;justify-content:center}
.nav.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.nav.on .num{background:#fff;color:var(--ink)}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.stp{display:inline-flex;align-items:center;min-height:36px;padding:6px 12px;border-radius:999px;border:1px solid #C9C9C3;background:#fff;color:#27272A;text-decoration:none}
.stp.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.stp.off{color:var(--muted);background:#F1F1EE}
.sep{color:#A1A1AA}
.banner{border-radius:10px;padding:12px 14px;font-size:13px;border:1px solid;overflow-wrap:anywhere}
.banner.warn{background:#FFF7E6;border-color:#F1D49B;color:#5C3A00}
.banner.err{background:#FDECEC;border-color:#F3B4B4;color:#7F1D1D}
.banner.info{background:#EEF2FF;border-color:#C7D2FE;color:var(--accent-d)}
.banner.ok{background:#ECFDF3;border-color:#A7E3BE;color:#14532D}
.cols3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.25fr);gap:14px;align-items:start}
section.card,article.card,div.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
section.card.gen{border:2px solid var(--accent);padding:16px 18px;gap:12px}
.scroll{display:flex;flex-direction:column;gap:6px;max-height:640px;overflow-y:auto;padding-right:2px}
label.l{font-size:13px;font-weight:600}
textarea,input[type=text],input[type=search],select{border:1px solid #C9C9C3;border-radius:8px;padding:8px 10px;background:#fff;width:100%;min-width:0;min-height:40px}
textarea{min-height:64px;resize:vertical;border-radius:10px}
select{width:auto;flex:1 1 140px}
.check{display:flex;gap:10px;align-items:center;min-height:44px;font-size:13px}
.check input{width:20px;height:20px;flex:none}
.btn{min-height:44px;padding:8px 20px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
.btn:hover:not(:disabled){background:var(--accent-d)}
.btn.green{background:var(--green);border-color:var(--green)}
.btn.ghost{background:#fff;color:var(--accent)}
.btn.ghost:hover:not(:disabled){background:#EEF2FF;color:var(--accent-d)}
.btn:disabled{background:#E7E7E2;border-color:#C9C9C3;color:var(--muted);cursor:not-allowed}
.small{min-height:40px;padding:6px 14px;border-radius:8px;border:1px solid #C9C9C3;background:#fff;cursor:pointer;font-weight:600;font-size:13px}
.small:disabled{opacity:.55;cursor:not-allowed}
.small.danger{border-color:#B91C1C;color:#7F1D1D}
.small.mini{min-height:36px;font-size:12px;font-weight:500;padding:4px 10px}
.err-inline{color:#B91C1C;font-size:13px;margin:0;overflow-wrap:anywhere}
.pillbtn{min-height:40px;padding:6px 12px;border-radius:999px;border:1px solid #C9C9C3;background:#fff;cursor:pointer;font-size:13px}
.pillbtn[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid #EFEFEA;padding-bottom:6px}
.tabb{min-height:40px;padding:6px 12px;border:none;border-bottom:2px solid transparent;background:none;color:var(--muted);cursor:pointer;font-size:13px}
.tabb[aria-selected=true]{border-bottom-color:var(--accent);color:var(--accent-d);font-weight:600}
.nov{font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;display:inline-block}
.nov.d{background:var(--accent-d);color:#fff}.nov.p{background:#DBEAFE;color:var(--accent-d)}.nov.c{background:#E7E7E2;color:var(--ink2)}.nov.u{background:#fff;color:var(--muted);border:1px solid #C9C9C3}
.prow{display:flex;gap:8px;align-items:flex-start;padding:8px;border-radius:8px;border:1px solid #EFEFEA;background:#fff;min-width:0}
.prow.sel{border-color:var(--accent)}
.prow.in{background:#F5F8FF}
.prow .open{flex:1;min-width:0;text-align:left;background:none;border:none;padding:0;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-height:44px}
.prow .nm{font-size:13px;font-weight:600;overflow-wrap:anywhere}
.addb{flex:none;width:44px;height:44px;border-radius:8px;border:1px solid var(--accent);background:#fff;color:var(--accent);cursor:pointer;font-weight:700}
.addb.in{border-color:var(--green);background:#ECFDF3;color:#14532D}
.addb:disabled{border-color:#C9C9C3;color:var(--muted);background:#F1F1EE;cursor:not-allowed}
.pf{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:10px;border:1px solid var(--line);background:#fff;min-width:0}
.pf.sel{border-color:var(--accent)}
.ord{flex:none;display:inline-flex;width:24px;height:24px;border-radius:12px;background:#EEF2FF;color:var(--accent-d);font-size:12px;font-weight:700;align-items:center;justify-content:center}
.sq{width:44px;height:44px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer}
.sq.rm{border-color:#F3B4B4;color:#B91C1C}
.chip{font-size:10px;padding:2px 6px;border-radius:4px;background:#F1F1EE;color:var(--ink2);overflow-wrap:anywhere}
.chip.ok{background:#ECFDF3;color:#14532D}.chip.open{background:#FFF7E6;color:#3F2A00}
.empty{border:1px dashed #C9C9C3;border-radius:10px;padding:18px;text-align:center;color:var(--muted);font-size:13px}
.tiles2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tl{display:flex;flex-direction:column;gap:2px;border-radius:8px;padding:8px 10px;background:#F7F7F4;min-width:0}
.tl.warn{background:#FFF7E6}
.tl .k{font-size:11px;color:var(--muted)}.tl .v{font-size:18px;font-weight:700;overflow-wrap:anywhere}.tl .s{font-size:11px;color:var(--ink2);overflow-wrap:anywhere}
.note{font-size:12px;border-radius:6px;padding:6px 8px;overflow-wrap:anywhere}
.note.ok{background:#ECFDF3;color:#14532D}.note.open{background:#FFF7E6;border:1px solid #F1D49B;color:#3F2A00}.note.red{background:#FDECEC;color:#7F1D1D}.note.plain{background:#F7F7F4}
.candb{min-height:44px;padding:2px 10px;border-radius:6px;border:1px solid var(--accent);background:#fff;color:var(--accent-d);cursor:pointer;font-size:12px}
.fbar{display:grid;grid-template-columns:minmax(70px,110px) 1fr 40px;gap:8px;align-items:center;font-size:12px}
.fbar .tr{height:8px;border-radius:4px;background:#E7E7E2;overflow:hidden;display:block}
.fbar .tr i{display:block;height:100%}
.est{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:#F7F7F4;border-radius:10px;padding:12px 14px}
.est .t{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 240px}
.cmdbox{display:flex;gap:8px;align-items:center;background:var(--ink);border-radius:8px;padding:6px 6px 6px 10px;min-width:0;flex-wrap:wrap}
.cmdbox .w{font-size:11px;color:#A1A1AA;flex:none}
.cmdbox code{flex:1 1 200px;min-width:0;color:#F4F4F5;font-size:11px;overflow-wrap:anywhere}
.cmdbox button{flex:none;min-height:44px;padding:2px 12px;border-radius:6px;border:1px solid #52525B;background:#27272A;color:#F4F4F5;cursor:pointer;font-size:12px}
.cmds{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:8px}
.jobbox{display:flex;flex-direction:column;gap:8px;border-radius:10px;padding:12px 14px;border:1px solid var(--line);background:#fff}
.jobbox.failed{border-color:#F3B4B4;background:#FFFBFB}
.stage{font-size:11px;padding:3px 8px;border-radius:999px;background:#F1F1EE;color:var(--muted);border:1px solid #E7E7E2}
.stage.done{background:#DCFCE7;color:#14532D;border-color:#A7E3BE}
.stage.running{background:#DBEAFE;color:var(--accent-d);border-color:#93C5FD}
.stage.failed{background:#FDECEC;color:#7F1D1D;border-color:#F3B4B4}
.stage.skipped{border-style:dashed}
.cause{font-size:13px;color:#7F1D1D;background:#FDECEC;border-radius:8px;padding:8px 10px;overflow-wrap:anywhere;white-space:pre-wrap}
.optgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:14px}
.optcard{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;cursor:pointer;background:#fff;border-radius:12px;padding:16px;border:1px solid var(--line);min-width:0;width:100%}
.optcard[aria-pressed=true]{border:2px solid var(--accent);padding:15px}
.optcard .slot{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.optcard .nm{font-size:19px;font-weight:700;overflow-wrap:anywhere}
.optcard code{font-size:11px;color:var(--ink2);overflow-wrap:anywhere}
.m3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.m3 span{background:#F7F7F4;border-radius:8px;padding:8px;display:flex;flex-direction:column}
.m3 .k{font-size:11px;color:var(--muted)}.m3 .v{font-size:18px;font-weight:700}
.mxbox{overflow-x:auto;max-width:100%}
table.mx{border-collapse:separate;border-spacing:6px;min-width:760px;font-size:12px;width:100%}
table.mx th{text-align:left;font-weight:600;color:var(--muted);padding:4px 0;vertical-align:bottom}
table.mx th.sel{color:var(--accent)}
table.mx td{border-radius:6px;padding:6px 8px;vertical-align:top}
td.catalog{background:var(--accent);color:#fff}td.glue{background:#DBEAFE;color:var(--accent-d)}td.net-new{background:#EDEDE8;color:var(--ink2)}
td.sel{outline:2px solid var(--accent);outline-offset:-2px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:baseline}
.detgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:14px}
.li{display:flex;flex-direction:column;gap:1px;padding:6px 0;border-top:1px solid #EFEFEA}
.pin{font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;background:#FEF3C7;color:#78350F;margin-left:6px}
fieldset{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0;display:flex;flex-direction:column;gap:4px;min-width:0}
legend{font-size:12px;font-weight:600;color:var(--ink2);padding:0 4px}
.radio{display:flex;gap:10px;align-items:center;min-height:44px;font-size:13px;flex-wrap:wrap}
.radio input[type=radio]{width:20px;height:20px;flex:none}
.radio input[type=text]{flex:1 1 200px}
ol.kit{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ol.kit li{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;display:flex;flex-direction:column;gap:6px;min-width:0}
.kn{flex:none;display:inline-flex;min-width:30px;height:24px;padding:0 6px;border-radius:12px;background:#EEF2FF;color:var(--accent-d);font-size:12px;font-weight:700;align-items:center;justify-content:center}
.kind{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 8px;border-radius:4px;background:#E7E7E2;color:var(--ink2)}
.kind.scaffold{background:#DBEAFE;color:var(--accent-d)}.kind.cap{background:#ECFDF3;color:#14532D}.kind.gap{background:#FFF7E6;color:#5C3A00}.kind.glue{background:#EDE9FE;color:#4C1D95}
pre.spec{margin:0;background:var(--ink);color:#F4F4F5;border-radius:8px;padding:10px 12px;font-size:11px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:360px;overflow:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media(max-width:900px){.cols3{grid-template-columns:minmax(0,1fr)}.wrap{padding:16px 16px 32px}}
@media(prefers-reduced-motion:no-preference){.btn,.pillbtn,.small,.tabb{transition:background-color .15s,border-color .15s}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
<header style="display:flex;flex-direction:column;gap:12px">
  <div class="spread">
    <div class="row" style="gap:14px;align-items:baseline">
      <span class="title">Reincarnate</span><span class="muted" style="font-size:14px">Design studio</span>
    </div>
    <span class="pill" id="cat-pill">Catalog: loading</span>
  </div>
  <nav class="studio" aria-label="Studio">
    <a class="nav" id="nav-ingest" href="/"><span class="num">1</span>Ingestion: build your catalog</a>
    <a class="nav on" href="/studio" aria-current="page" id="nav-studio"><span class="num">2</span>Design your app</a>
  </nav>
  <ol class="steps" aria-label="Design steps" id="stepbar"></ol>
</header>
<div id="notices" style="display:flex;flex-direction:column;gap:10px"></div>
<main id="view" tabindex="-1"></main>
</div>

<script>
(function () {

}
function clear(el) { el.textContent = ''; }   /* the only way containers are emptied */
function $(id) { return document.getElementById(id); }
function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }
function num(x) { return typeof x === 'number' && isFinite(x) ? x : 0; }
function money(x, d) { return '$' + num(x).toFixed(d === undefined ? 2 : d); }
function list(x) { return Array.isArray(x) ? x : (x ? [x] : []); }
function cap(s) { s = String(s || ''); return s.charAt(0).toUpperCase() + s.slice(1); }
function partName(o, ref) {  // a coverage cell's `c17` as the part's name in that option
  var id = parseInt(String(ref || '').replace(/^c/, ''), 10);
  var p = list(o && o.parts).filter(function (x) { return x.id === id || 'c' + x.id === ref; })[0];
  return p ? str(p.name) : str(ref);
}
function str(x) { return x === null || x === undefined ? '' : (typeof x === 'string' ? x : (typeof x === 'object' ? (x.token || x.name || x.text || JSON.stringify(x)) : String(x))); }

function pct(x) { return x === null || x === undefined ? 'n/a' : Math.round(num(x) * 100) + '%'; }

}

function tokName(t) { t = str(t); return t.replace(/^(config|ext):/, ''); }
function novKey(v) { v = String(v || '').charAt(0).toLowerCase(); return 'dpcu'.indexOf(v) >= 0 && v ? v : 'u'; }
var NOV_LABEL = { d: 'Distinctive', p: 'Pattern', c: 'Commodity', u: 'Unrated' };
function novBadge(v) { var k = novKey(v); return h('span', { class: 'nov ' + k }, NOV_LABEL[k]); }

function barColor(v) { return v >= 0.5 ? '#15803D' : v >= 0.3 ? '#1D4ED8' : '#A1A1AA'; }

  var i = h('i'); i.style.width = Math.round(Math.max(0, Math.min(1, num(v))) * 100) + '%'; i.style.background = barColor(num(v));
  return h('div', { class: 'fbar' }, h('span', { style: 'overflow-wrap:anywhere' }, label), h('span', { class: 'tr', role: 'img', 'aria-label': 'fit ' + num(v).toFixed(2) }, i), h('span', { style: 'text-align:right' }, num(v).toFixed(2)));

  return null;

/* ---------- token and mode ---------- */
var TOKEN_KEY = 'reincarnate.token', STATE_KEY = 'reincarnate.studio';
var hash0 = location.hash || '';
var DEMO = /^#demo(\/|&|=|$)/.test(hash0);
var TOKEN = '';
var tm = /(?:^#|&)t=([^&]+)/.exec(hash0);
if (tm && !DEMO) { try { TOKEN = decodeURIComponent(tm[1]); } catch (e) { TOKEN = tm[1]; } }
if (!TOKEN && !DEMO) TOKEN = tryStore('get', TOKEN_KEY) || '';
if (TOKEN && !DEMO) tryStore('set', TOKEN_KEY, TOKEN);
if (tm && !DEMO) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* file: pages */ } }

function routeOf() { return (location.hash || '').replace(/^#(demo)?/, '') || '/'; }
function go(r) { location.hash = (DEMO ? '#demo' : '#') + r; }
function otherPageHref(path, demoFile) {
  if (DEMO) return demoFile + '#demo';
  return path + (TOKEN ? '#t=' + encodeURIComponent(TOKEN) : '');
}

/* ---------- state ---------- */
var saved = {};
try { saved = JSON.parse(tryStore('get', STATE_KEY) || '{}') || {}; } catch (e) { saved = {}; }
var S = {
  cat: null, byId: {}, catErr: '', ids: list(saved.ids).filter(function (x) { return typeof x === 'number'; }), roles: (saved.roles && typeof saved.roles === 'object') ? saved.roles : {},
  idea: typeof saved.idea === 'string' ? saved.idea : '', nOpts: [2, 3, 4].indexOf(saved.nOpts) >= 0 ? saved.nOpts : 3,

function api(method, path, body) {
  if (DEMO) return demo(method, path, body);
  var opts = { method: method, headers: { 'X-Reincarnate-Token': TOKEN }, cache: 'no-store' };
  if (method === 'POST') { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body || {}); }
  return fetch(path, opts).then(function (r) {
    return r.text().then(function (t) {
      var data = null;
      try { data = t ? JSON.parse(t) : {}; } catch (e) { data = null; }
      if (r.status === 403 && !S.staleToken) { S.staleToken = true; renderNotices(); }
      if (!r.ok || (data && data.error)) throw new Error((data && data.error) || ('Request failed (' + r.status + ')'));
      if (S.staleToken) { S.staleToken = false; renderNotices(); }
      if (data === null) throw new Error('The server sent something that is not JSON');
      return data;
    });
  }, function () { throw new Error('Cannot reach the server. Is `reincarnate serve` still running?'); });
}

var OTHER = '__other__';
function decisionField(d) {

function decisionAnswers() {
